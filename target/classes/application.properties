spring.application.name=project1
server.port=8080

# MySQL - change user/password here or set DB_URL / DB_USER / DB_PASS env vars
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careplan?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
